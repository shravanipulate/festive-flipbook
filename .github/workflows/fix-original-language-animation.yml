name: Fix original language text

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  replace-language-text:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace only the existing language text
        shell: python
        run: |
          from pathlib import Path
          p = Path('public/experience.html')
          s = p.read_text(encoding='utf-8')

          replacements = {
              'Helloनमस्तेনমস্কারこんにちはمرحباOláনमस्कार': 'नमस्ते   Hello   प्रणाम   ਸਤ ਸ੍ਰੀ ਅਕਾਲ   Hallo   こんにちは   नमः   নমস্কাৰ   নমস্কার   ନମସ୍କାର   प्रणाम   Hello   你好',
              'Hello नमस्ते নমস্কার こんにちは مرحبا Olá नमस्कार': 'नमस्ते   Hello   प्रणाम   ਸਤ ਸ੍ਰੀ ਅਕਾਲ   Hallo   こんにちは   नमः   নমস্কাৰ   নমস্কার   ନମସ୍କାର   प्रणाम   Hello   你好',
              'Helloনমস্তেনমস্কারこんにちはمرحباOláनमस्कार': 'नमस्ते   Hello   प्रणाम   ਸਤ ਸ੍ਰੀ ਅਕਾਲ   Hallo   こんにちは   नमः   নমস্কাৰ   নমস্কার   ନମସ୍କାର   प्रणाम   Hello   你好',
          }

          changed = False
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new)
                  changed = True

          if not changed:
              print('No exact old language string found; leaving HTML untouched.')
          else:
              p.write_text(s, encoding='utf-8')
              print('Replaced only the greeting text; original HTML element/CSS/animation was untouched.')

      - name: Commit HTML change and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/experience.html
          git rm .github/workflows/fix-original-language-animation.yml
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Replace opening greetings while preserving original animation'
          git push
