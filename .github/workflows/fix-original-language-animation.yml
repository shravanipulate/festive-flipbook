name: Fix original language animation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace greeting text only
        shell: python
        run: |
          from pathlib import Path
          p = Path('public/experience.html')
          s = p.read_text(encoding='utf-8')
          new = 'नमस्ते   Hello   प्रणाम   ਸਤ ਸ੍ਰੀ ਅਕਾਲ   Hallo   こんにちは   नमः   নমস্কাৰ   নমস্কার   ନମସ୍କାର   प्रणाम   Hello   你好'
          olds = [
            'Helloनमस्तेনমস্কারこんにちはمرحباOláনमस्कार',
            'Hello नमस्ते নমস্কার こんにちは مرحبا Olá नमस्कार',
            'Helloনমস্তেনমস্কারこんにちはمرحباOláनमस्कार',
          ]
          for old in olds:
            s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/experience.html
          git rm .github/workflows/fix-original-language-animation.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Replace opening greetings and preserve original animation'
          git push
