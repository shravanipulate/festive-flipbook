name: Inspect language text

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Extract exact language snippets
        shell: python
        run: |
          from pathlib import Path
          s = Path('public/experience.html').read_text(encoding='utf-8')
          terms = ['10+ LANGUAGES','Hello','नमस्ते','নমস্কার','こんにちは','مرحبا','Olá','Bonjour','Hola','안녕','नमस्कार','ਸਤ ਸ੍ਰੀ ਅਕਾਲ']
          out=[]
          for term in terms:
              start=0
              count=0
              while True:
                  i=s.find(term,start)
                  if i<0: break
                  count += 1
                  a=max(0,i-500); b=min(len(s),i+500)
                  out.append(f'--- {term} occurrence {count} ---\n{s[a:b]}\n')
                  start=i+len(term)
                  if count>=8: break
          Path('language-debug.txt').write_text('\n'.join(out),encoding='utf-8')
      - name: Commit debug output and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add language-debug.txt
          git rm .github/workflows/inspect-language.yml
          git commit -m 'Inspect original language animation text'
          git push
